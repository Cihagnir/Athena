# Sunucuda backend/tunnel/config.yml olarak durur (repoya girmez); scripts/deploy.sh dokunmaz.
# Tünel kimlik dosyası (credentials.json) aynı klasördedir.
tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # PocketBase yönetim paneli internete açılmaz; erişim: docs/DEPLOY.md → Yönetim paneli.
  - hostname: tasks.example.com
    path: ^/_/
    service: http_status:404
  - hostname: tasks.example.com
    service: http://pocketbase:8090
  - service: http_status:404
