services:
  pocketbase:
    build: .
    image: task-tracker-pocketbase:0.40.4
    container_name: task-tracker-pb
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      # Yalnızca loopback. Sunucuda dışarıya açılım aşağıdaki tünel servisiyle (docs/DEPLOY.md).
      - "127.0.0.1:${PB_PORT:-8090}:8090"
    volumes:
      # Veri imajdan bağımsızdır. Yerelde adlandırılmış volume; sunucuda PB_DATA ile açık bir
      # klasöre bağlanır (yedekleme/taşıma düz dosya işi olsun diye).
      - ${PB_DATA:-pb_data}:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations:ro
      - ./pb_hooks:/pb/pb_hooks:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel — yalnızca sunucuda: `docker compose --profile tunnel up -d`.
  # Yapılandırma ve kimlik dosyası ./tunnel altında (repoya girmez); bkz. docs/DEPLOY.md.
  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    profiles: [tunnel]
    container_name: task-tracker-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./tunnel:/etc/cloudflared:ro
    depends_on:
      - pocketbase

volumes:
  pb_data:
